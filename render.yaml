services:
  - type: web
    name: ai-interview-backend
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-interview-db
          property: connectionString
      - key: DATABASE_SYNC_URL
        fromDatabase:
          name: ai-interview-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-interview-redis
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["http://localhost:3000","http://localhost:3001"]'

databases:
  - name: ai-interview-db
    databaseName: ai_interview
    user: postgres
